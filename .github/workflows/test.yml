name: Test

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify

  trainer:
    # The LLM trainer's tests cover its pure logic and import torch lazily; the own brain's tests
    # train tiny brains for real, so they get CPU torch (they skip without it).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover tests
